name: Project 11 scheduled operations run

on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * 1-5'

jobs:
  scheduled-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-11-operations-automation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run operations pipeline
        env:
          PYTHONPATH: .
        run: python run_daily.py

      - name: Upload generated operations outputs
        uses: actions/upload-artifact@v4
        with:
          name: project-11-operations-output
          path: |
            projects/project-11-operations-automation/data/processed
            projects/project-11-operations-automation/data/review
            projects/project-11-operations-automation/data/audit
            projects/project-11-operations-automation/reports
          if-no-files-found: error

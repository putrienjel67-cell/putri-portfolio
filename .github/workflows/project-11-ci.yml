name: Project 11 Python checks

on:
  push:
    paths:
      - 'projects/project-11-operations-automation/**'
      - '.github/workflows/project-11-ci.yml'
  pull_request:
    paths:
      - 'projects/project-11-operations-automation/**'
      - '.github/workflows/project-11-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/project-11-operations-automation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Run sample pipeline
        env:
          PYTHONPATH: .
        run: python src/pipeline.py
